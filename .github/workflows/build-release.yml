# Build and release.
#
#   push to feature/desktop       -> test, build Cherrion.exe, and update the "desktop-latest" pre-release
#                                    (always the newest feature/desktop build, on the repo's Releases page)
#   push / pull request to master -> test, then build Cherrion.exe (downloadable from the run's Artifacts)
#   push a tag vX.Y.Z             -> the same, then publish a GitHub Release with Cherrion.exe attached
#
# Release:  git tag v1.0.1 && git push origin v1.0.1   (the tag sets the exe's version; keep
#           "version" in package.json in step, or the build warns)
# The web version is not deployed from here: Vercel's Git integration deploys on its own.
name: Build and release

on:
  push:
    branches: [master, feature/desktop]
    tags: ['v*']
  pull_request:
    branches: [master, feature/desktop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # Vault file + sync client (standard library only, no GUI needed).
      - run: python -m unittest discover -s desktop/tests -t desktop -v

  desktop:
    name: Build Cherrion.exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: desktop/requirements-build.txt
      - name: Take the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The tag is the release version (v1.0.0 -> 1.0.0); build.py stamps it into the exe.
          tag_version="${GITHUB_REF_NAME#v}"
          echo "CHERRION_VERSION=$tag_version" >> "$GITHUB_ENV"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$package_version" != "$tag_version" ]; then
            echo "::warning::package.json says $package_version but the tag is $GITHUB_REF_NAME; the exe uses $tag_version. Update package.json to match."
          fi
      - run: npm ci
      - run: npm run build:desktop
      - run: python -m pip install -r desktop/requirements-build.txt
      - run: python desktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Cherrion-windows
          path: desktop/dist/Cherrion.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cherrion-windows
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum Cherrion.exe > Cherrion.exe.sha256
          gh release create "$GITHUB_REF_NAME" Cherrion.exe Cherrion.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Cherrion $GITHUB_REF_NAME" --generate-notes

  branch-release:
    name: Publish feature/desktop build
    # Pushes only (not pull requests), so the pre-release always matches the branch.
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/desktop'
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: desktop-latest-release
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Cherrion-windows
          path: dist
      - name: Replace the desktop-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          short="${GITHUB_SHA::7}"
          cd dist
          sha256sum Cherrion.exe > Cherrion.exe.sha256
          # One rolling pre-release: remove the previous one and its tag, then publish this build.
          gh release delete desktop-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create desktop-latest Cherrion.exe Cherrion.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Cherrion feature/desktop build (v$version, $short)" \
            --notes "Automatic build of the feature/desktop branch at commit $GITHUB_SHA. Not a stable release: it is replaced on every push to feature/desktop."
