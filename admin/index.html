<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Same rules as the app: scripts and API calls only from this site. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <meta name="referrer" content="no-referrer" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%92%3C/text%3E%3C/svg%3E" />
  <title>Cherrion admin</title>
</head>
<body class="admin-page">
  <div id="admin-root"></div>

  <!-- Shared with the app (ui/dialog.ts). -->
  <div id="confirm-modal" class="modal hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <div class="modal-card modal-small">
      <h3 id="confirm-title" class="confirm-title"></h3>
      <p id="confirm-message" class="confirm-message"></p>
      <ul id="confirm-details" class="confirm-details hidden"></ul>
      <div class="modal-actions end">
        <button type="button" id="confirm-cancel" class="action-btn">Cancel</button>
        <button type="button" id="confirm-ok" class="primary-btn danger">Delete</button>
      </div>
    </div>
  </div>

  <div id="admin-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="admin-modal-title">
    <div class="modal-card modal-wide">
      <div class="modal-header">
        <h3 id="admin-modal-title"></h3>
        <button type="button" id="admin-modal-close" aria-label="Close">✕</button>
      </div>
      <div id="admin-modal-body"></div>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <script type="module" src="/src/admin/main.ts"></script>
</body>
</html>
